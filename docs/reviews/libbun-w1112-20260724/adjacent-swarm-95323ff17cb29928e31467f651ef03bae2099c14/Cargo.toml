serde_ipld_dagcbor = "0.6.4"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
hex = "0.4.3"
sha2 = "0.10"
thiserror = "2.0.17"
rustls-pki-types = "1.14.1"
rustls = "0.23"
rustls-webpki = { version = "0.103.13", features = ["ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.18"
tokio-postgres = { version = "0.7.17", default-features = false, features = ["runtime", "with-serde_json-1"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log", "bloom"] }
axum = "0.8"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "service", "tokio"] }
tower = { version = "0.5", features = ["util"] }
rand = { version = "0.10", features = ["thread_rng"] }
russh = "0.61.1"
toml = "0.8.19"
wasm-bindgen = "0.2.118"
x509-parser = "0.18.1"
rcgen = "0.14.8"
# Determinism tables (string-model S1 / ADR-2140). Exact-pinned: the Unicode
# data version behind NFC + grapheme segmentation is part of the semantics
# version. Upgrade only by explicit ruling (both currently vendor Unicode 17.0.0).
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.2"
# NUMBER-MODEL rung N1 (charter R1): the SwarmInteger exact-integer backing is
# arbitrary-precision num-bigint, PINNED exact (=x.y.z) for deterministic replay.
# This is a permanent end-state dependency, not a bridge.
num-bigint = "=0.4.6"
num-traits = "=0.2.19"

[profile.dev]
debug = 0
lto = false
codegen-units = 256
incremental = true

[profile.wasm-dev]
inherits = "release"
opt-level = 1
debug = true
lto = false
codegen-units = 256
incremental = true
