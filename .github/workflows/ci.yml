name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  prepared-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable
      - run: rustup toolchain install nightly-2026-05-06
      - name: Test affine root supervisor
        run: cargo test
      - name: Test private one-drive wire
        run: cargo test --manifest-path wire/Cargo.toml
      - name: Verify vendored Bun source reproducibility
        run: scripts/verify-vendored-bun-reproducible.sh
      - name: Configure pinned Bun codegen
        run: scripts/configure-vendored-bun.sh
      - name: Check one-shot native worker
        run: cargo +nightly-2026-05-06 check --manifest-path runtime/Cargo.toml
